<!doctype html>
<html lang="zh-CN" class="prototype-mode">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

      document.documentElement.classList.add('prototype-mode');
      document.title='搜同破解 · 运营验收原型';
    }
  </script>
  <style>
    :root {
      --bg: #070a10;
      --surface: #111721;
      --fg: #f5f1e8;
      --muted: #929baa;
      --border: #27303c;
      --accent: #e2b45f;
      --mine-bg: #dcecff;
      --mine-surface: #f4f9ff;
      --mine-fg: #0b1d36;
      --mine-muted: #55708f;
      --mine-border: #b9d1ec;
      --mine-accent: #efbd48;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 7%, transparent);
      --font-display: 'Songti SC', 'STSong', 'Iowan Old Style', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(20,159,213,.32); outline-offset: 2px; }
    button:active { transform: scale(.985); }
    body {
      min-height: 100vh;
      background:
        radial-gradient(55% 80% at 50% 0%, color-mix(in oklch, var(--accent) 7%, var(--bg)), var(--bg) 62%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.45;
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .caption {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      padding: 10px;
      border-radius: 54px;
      background: color-mix(in oklch, var(--surface) 76%, black);
      box-shadow: 0 30px 80px color-mix(in oklch, black 60%, transparent), inset 0 0 0 2px black;
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      top: 116px;
      bottom: 108px;
      width: 3px;
      background: color-mix(in oklch, var(--fg) 9%, black);
    }
    .device::before { left: -2px; }
    .device::after { right: -2px; }
    .rail { position: absolute; width: 4px; border-radius: 3px; background: black; }
    .rail.silent { left: -3px; top: 176px; height: 30px; }
    .rail.up { left: -3px; top: 220px; height: 58px; }
    .rail.down { left: -3px; top: 288px; height: 58px; }
    .rail.power { right: -3px; top: 246px; height: 98px; }
    .island {
      position: absolute;
      top: 20px;
      left: 50%;
      width: 122px;
      height: 35px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: black;
      z-index: 30;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 44px;
      background: var(--bg);
    }
    .statusbar {
      position: relative;
      z-index: 20;
      flex: 0 0 47px;
      padding: 17px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 650;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 5px; }
    .statusbar svg { width: 16px; height: 11px; fill: currentColor; }
    .statusbar .battery { width: 24px; }
    .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .content { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .content::-webkit-scrollbar { display: none; }
    .home-indicator { flex: 0 0 calc(20px + var(--safe-bottom)); position: relative; z-index: 20; background: var(--surface); }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: calc(6px + var(--safe-bottom));
      width: 132px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--fg);
    }

    .pad { padding-inline: 18px; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header { padding: 10px 18px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header h1, .h1, .h2 { font-family: var(--font-display); margin: 0; letter-spacing: -.02em; }
    .header h1, .h1 { font-size: 25px; line-height: 1.1; }
    .h2 { font-size: 20px; line-height: 1.2; }
    .h3 { font-size: 15px; font-weight: 650; margin: 0; }
    .meta { color: var(--muted); font-size: 12px; }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font: 10px/1.4 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; }
    .icon-btn {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--fg);
    }
    .icon-btn svg, .tab svg, .action svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }

    .tabs, .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
    .top-tabs { padding: 2px 18px 11px; gap: 20px; }
    .top-tab {
      min-height: 44px;
      padding: 12px 0 8px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
    }
    .top-tab.active { color: var(--fg); border-color: var(--accent); font-weight: 650; }
    .chip {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip.active { color: var(--fg); border-color: var(--fg); }

    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .card-pad { padding: 16px; }
    .placeholder {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 22%, var(--accent-soft), transparent 28%),
        linear-gradient(145deg, color-mix(in oklch, var(--surface) 65%, var(--bg)), var(--surface));
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .placeholder::before {
      content: '';
      width: 42%;
      aspect-ratio: 3/4;
      border-radius: 46% 46% 20% 20%;
      background: linear-gradient(180deg, color-mix(in oklch, var(--fg) 26%, transparent), color-mix(in oklch, var(--fg) 5%, transparent));
      filter: blur(.2px);
    }
    .placeholder span { position: absolute; bottom: 12px; font: 10px var(--font-mono); letter-spacing: .08em; }
    .ratio-video { aspect-ratio: 16/10; }
    .ratio-poster { aspect-ratio: 3/4; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--bg) 78%, transparent);
      border: 1px solid color-mix(in oklch, var(--fg) 20%, transparent);
      color: var(--fg);
      font: 10px var(--font-mono);
    }
    .btn-primary, .btn-secondary {
      min-height: 48px;
      width: 100%;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 650;
    }
    .btn-primary { border: 0; background: var(--accent); color: var(--bg); }
    .btn-secondary { border: 1px solid var(--border); background: transparent; color: var(--fg); }

    .video-stage { position: relative; min-height: 598px; background: var(--surface); overflow: hidden; }
    .video-stage .placeholder { position: absolute; inset: 0; border: 0; }
    .video-stage .placeholder::before { width: 72%; transform: translateY(28px); }
    .video-shade { position: absolute; inset: 30% 0 0; background: linear-gradient(transparent, color-mix(in oklch, var(--bg) 94%, transparent)); }
    .video-copy { position: absolute; left: 18px; right: 72px; bottom: 20px; z-index: 2; }
    .video-copy p { margin: 6px 0 0; color: color-mix(in oklch, var(--fg) 82%, var(--muted)); }
    .short-author-link { display:block; width:max-content; max-width:100%; padding:0; border:0; background:none; color:inherit; text-align:left; }
    .short-author-link .h3 { margin:0; }
    .trial { position: absolute; top: 16px; left: 18px; z-index: 3; }
    .action-rail { position: absolute; right: 12px; bottom: 22px; z-index: 3; display: flex; flex-direction: column; gap: 15px; }
    .action { width: 48px; min-height: 48px; border: 0; background: transparent; color: var(--fg); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; }
    .action-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--fg-soft); border: 1px solid var(--border); }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(18px);
    }
    .tab { min-height: 58px; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 9px; }
    .tab.active { color: var(--accent); }

    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .poster .placeholder { aspect-ratio: 4/5; }
    .poster-body { padding: 10px; }
    .poster-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .poster-meta { margin-top: 5px; display: flex; justify-content: space-between; color: var(--muted); font: 10px var(--font-mono); }
    .section-title { margin: 20px 0 10px; }

    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .tool { min-height: 128px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--fg); text-align: left; }
    .tool-mark { width: 34px; height: 34px; margin-bottom: 22px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); }
    .tool-mark svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .tool p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .post { padding: 15px 0; border-top: 1px solid var(--border); }
    .post:first-child { border-top: 0; }
    .avatar { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background: var(--fg-soft); border: 1px solid var(--border); }
    .post p { margin: 10px 0; }
    .post-media { height: 146px; border: 1px solid var(--border); border-radius: 14px; background: linear-gradient(145deg, var(--surface), var(--fg-soft)); }
    .post-actions { margin-top: 10px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

    .profile-head { padding: 8px 18px 18px; }
    .member-banner {
      position: relative;
      min-height: 138px;
      padding: 18px;
      border: 1px solid color-mix(in oklch, var(--fg) 15%, var(--border));
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 18%, color-mix(in oklch, var(--accent) 18%, transparent), transparent 28%),
        linear-gradient(135deg, color-mix(in oklch, var(--surface) 78%, var(--accent)), var(--surface));
    }
    .member-banner::after { content: ''; position: absolute; right: -20px; bottom: -44px; width: 150px; height: 150px; border: 1px solid color-mix(in oklch, var(--fg) 16%, transparent); border-radius: 50%; }
    .member-banner p { margin: 6px 0 18px; color: var(--muted); }
    .mini-cta { position: relative; z-index: 1; min-height: 40px; padding: 9px 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 650; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .asset { padding: 13px 8px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); text-align: center; }
    .asset::before { content: ''; display: block; width: 24px; height: 24px; margin: 0 auto 6px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, var(--surface), var(--accent) 35%, color-mix(in oklch, var(--accent) 45%, var(--fg))); box-shadow: 0 7px 14px var(--accent-soft); }
    .asset strong { display: block; font: 18px var(--font-mono); }
    .asset span { color: var(--muted); font-size: 10px; }
    .menu { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .menu-row { width: 100%; min-height: 50px; padding: 0 15px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--fg); display: flex; align-items: center; justify-content: space-between; text-align: left; }
    .menu-row:first-child { border-top: 0; }

    .backbar { min-height: 52px; padding: 4px 12px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); }
    .backbar strong { text-align: center; font-family: var(--font-display); font-size: 17px; }
    .back-btn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--fg); font-size: 24px; }
    .notice { padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--fg-soft); color: var(--muted); font-size: 12px; }
    .notice strong { color: var(--fg); }
    .progress-line { position:absolute; left:0; right:0; bottom:0; z-index:4; height:3px; background:var(--border); overflow:hidden; }
    .progress-line span { display: block; height: 100%; background: var(--accent); }
    .detail-player { position:relative; aspect-ratio:16/10; background:#05070a; color:white; overflow:hidden; isolation:isolate; }
    .detail-player .placeholder { position: absolute; inset: 0; border: 0; }
    .detail-player.is-fullscreen { position:absolute; inset:0; z-index:45; aspect-ratio:auto; }
    .detail-player.is-fullscreen .placeholder::before { width:45%; }
    .player-visual { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 52% 26%,#4b5969 0,#1f252d 31%,#06080b 78%); }
    .player-visual::before { content:''; position:absolute; width:42%; height:105%; left:30%; top:9%; border-radius:48% 48% 17% 17%; background:linear-gradient(180deg,rgba(239,242,246,.72),rgba(34,40,50,.42)); transform:rotate(-5deg); }
    .player-visual::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 42%,rgba(0,0,0,.72)); }
    .player-loading { position:absolute; inset:0; z-index:5; display:grid; place-items:center; background:rgba(1,3,6,.46); }
    .loading-ring { width:38px; height:38px; border:3px solid rgba(255,255,255,.24); border-top-color:white; border-radius:50%; animation:player-spin .72s linear infinite; }
    .loading-copy { position:absolute; top:calc(50% + 30px); font-size:10px; color:rgba(255,255,255,.74); }
    @keyframes player-spin { to { transform:rotate(360deg); } }
    .player-center { position:absolute; left:calc(50% - 29px); top:calc(50% - 29px); z-index:8; width:58px; height:58px; border:1px solid rgba(255,255,255,.28); border-radius:50%; background:rgba(0,0,0,.46); color:white; display:grid; place-items:center; backdrop-filter:blur(10px); pointer-events:auto; }
    .player-center svg { width:25px; height:25px; fill:currentColor; stroke:currentColor; }
    .player-ui { position:absolute; left:0; right:0; bottom:0; z-index:6; padding:34px 12px 9px; background:linear-gradient(transparent,rgba(0,0,0,.88)); }
    .player-progress { display:block; width:100%; height:16px; margin:0; appearance:none; background:transparent; cursor:pointer; }
    .player-progress::-webkit-slider-runnable-track { height:3px; border-radius:4px; background:linear-gradient(90deg,#25b6e7 0 var(--progress),rgba(255,255,255,.32) var(--progress)); }
    .player-progress::-webkit-slider-thumb { appearance:none; width:11px; height:11px; margin-top:-4px; border-radius:50%; background:white; box-shadow:0 0 0 3px rgba(37,182,231,.26); }
    .player-bar { display:flex; align-items:center; gap:7px; min-height:30px; }
    .player-spacer { flex:1; }
    .player-icon { min-width:30px; height:30px; padding:0 5px; border:0; background:transparent; color:white; display:grid; place-items:center; font-size:10px; }
    .player-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .player-icon .fill { fill:currentColor; stroke:none; }
    .player-time { font:9px var(--font-mono); color:rgba(255,255,255,.86); white-space:nowrap; }
    .trial-overlay { position:absolute; inset:0; z-index:7; display:grid; place-content:center; justify-items:center; padding:42px 24px 58px; text-align:center; background:radial-gradient(circle at 50% 42%,rgba(21,34,50,.72),rgba(2,4,7,.94) 68%); }
    .trial-lock { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.2); }
    .trial-lock svg { width:21px; height:21px; fill:none; stroke:white; stroke-width:1.8; }
    .trial-overlay strong { margin-top:10px; font-size:17px; }
    .trial-overlay p { margin:4px 0 12px; color:rgba(255,255,255,.68); font-size:10px; }
    .trial-overlay .trial-cta { min-height:34px; padding:0 16px; border:0; border-radius:18px; background:white; color:#10151c; font-size:11px; font-weight:800; }
    .player-mini-status { position:absolute; top:10px; left:12px; z-index:4; display:flex; gap:6px; }
    .player-chip { padding:4px 7px; border-radius:4px; background:rgba(0,0,0,.56); color:white; font:8px var(--font-mono); }
    .detail-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .detail-actions button { min-height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--muted); }
    .detail-section { padding:14px 10px; border-top:8px solid #f4f6f9; background:white; }
    .detail-section-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .detail-section-title strong { font-size:14px; }
    .detail-section-title span { color:#929ba6; font-size:9px; }
    .recommendation-section .media-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 8px; }
    .recommendation-section .media-card { min-width:0; }
    .comment-item { display:grid; grid-template-columns:34px 1fr auto; gap:9px; padding:11px 0; border-top:1px solid #edf1f5; }
    .comment-item:first-of-type { border-top:0; }
    .comment-avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(145deg,#84d4ef,#6a58ad); }
    .comment-item p { margin:3px 0; font-size:11px; color:#303844; }
    .comment-item small { color:#98a2ad; font-size:8px; }
    .comment-like { border:0; background:none; color:#929ba6; font-size:9px; }
    .comment-compose { display:grid; grid-template-columns:1fr auto; gap:7px; margin-top:9px; }
    .comment-compose input { min-width:0; height:38px; padding:0 12px; border:1px solid #e0e7ee; border-radius:19px; background:#f6f8fb; color:#18202a; }
    .comment-compose button { min-width:58px; border:0; border-radius:19px; background:#11151b; color:white; font-size:10px; }
    .profile-page { min-height:100%; background:#f7f9fc; }
    .profile-hero { position:relative; padding:28px 15px 16px; background:linear-gradient(145deg,#dff7ff,#ecedff 54%,#fff5df); }
    .profile-hero::after { content:''; position:absolute; right:-22px; top:-38px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.42); filter:blur(2px); }
    .profile-identity { position:relative; z-index:2; display:grid; grid-template-columns:68px 1fr auto; gap:11px; align-items:center; }
    .profile-avatar-lg { width:68px; height:68px; border:4px solid white; border-radius:50%; background:linear-gradient(145deg,#fa776d,#5735a1); box-shadow:0 8px 18px rgba(52,72,110,.18); }
    .profile-identity h2 { margin:0; font-size:18px; }
    .profile-identity p { margin:3px 0 0; color:#64758a; font-size:9px; }
    .follow-btn { height:32px; padding:0 12px; border:0; border-radius:16px; background:#11151b; color:white; font-size:10px; }
    .profile-bio { position:relative; z-index:2; margin:13px 0 0; color:#405167; font-size:10px; line-height:1.6; }
    .profile-stats { display:grid; grid-template-columns:repeat(4,1fr); padding:13px 8px; background:white; border-bottom:1px solid #e8edf2; text-align:center; }
    .profile-stats strong { display:block; font-size:14px; }
    .profile-stats span { color:#8d98a5; font-size:8px; }
    .profile-content-tabs { display:grid; grid-template-columns:1fr 1fr; background:#fff; border-bottom:1px solid #e7edf3; }
    .profile-content-tabs button { min-height:42px; border:0; background:none; color:#7c8794; font-size:12px; }
    .profile-content-tabs button.active { color:#111820; font-weight:800; box-shadow:inset 0 -2px #111820; }
    .profile-search-box { padding:10px; background:#fff; }
    .profile-search-row { display:grid; grid-template-columns:20px 1fr; gap:7px; align-items:center; min-height:38px; padding:0 12px; border:1px solid #dfe7ef; border-radius:20px; background:#f5f8fb; color:#7b8794; }
    .profile-search-row svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; }
    .profile-search-row input { min-width:0; border:0; outline:0; background:transparent; color:#17202b; font-size:11px; }
    .profile-search-help { display:block; margin:6px 5px 0; color:#8d98a5; font-size:9px; }
    .profile-post-list { display:grid; gap:8px; padding-bottom:10px; }
    .profile-post-card { width:100%; padding:12px; border:1px solid #e4eaf0; border-radius:10px; background:#fff; color:#18202a; text-align:left; }
    .profile-post-card strong { display:block; font-size:12px; }
    .profile-post-card p { margin:6px 0; color:#677484; font-size:10px; line-height:1.55; }
    .post-detail { min-height:100%; background:white; }
    .post-detail-body { padding:14px 12px; }
    .post-detail-title { margin:13px 0 7px; font-size:18px; line-height:1.45; }
    .post-detail-copy { color:#404b58; font-size:12px; line-height:1.75; }
    .post-detail-media { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:12px 0; }
    .post-detail-media .media-thumb { aspect-ratio:1; border-radius:7px; }
    .post-editor { min-height:100%; background:#f6f8fb; }
    .editor-form { padding:12px; }
    .editor-card { margin-bottom:10px; padding:13px; border:1px solid #e4e9ef; border-radius:12px; background:white; }
    .editor-label { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; font-size:12px; font-weight:800; }
    .editor-label small { color:#96a0ac; font-size:8px; font-weight:500; }
    .topic-grid { display:flex; flex-wrap:wrap; gap:7px; }
    .topic-option { min-height:30px; padding:0 11px; border:1px solid #e1e7ed; border-radius:16px; background:white; color:#596575; font-size:10px; }
    .topic-option.active { border-color:#11151b; background:#11151b; color:white; }
    .editor-input,.editor-textarea { width:100%; border:0; outline:0; background:transparent; color:#17202a; font:inherit; }
    .editor-input { height:36px; font-size:15px; font-weight:750; }
    .editor-textarea { min-height:128px; resize:none; line-height:1.7; font-size:12px; }
    .media-add-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .media-add { min-height:80px; border:1px dashed #cfd8e2; border-radius:9px; background:#f8fafc; color:#6d7988; font-size:10px; }
    .media-add.active { border-style:solid; border-color:#5a87aa; background:#eaf7ff; color:#254d68; }
    .editor-submit { width:100%; min-height:46px; border:0; border-radius:12px; background:#11151b; color:white; font-weight:800; }
    .state-list { margin: 14px 0; }
    .state-row { position: relative; min-height: 48px; padding-left: 28px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .state-row::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: var(--border); }
    .state-row::after { content: ''; position: absolute; left: 3px; top: 19px; width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
    .state-row.done::after, .state-row.current::after { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .state-row.current { color: var(--fg); }
    .state-row.pending { color: var(--muted); }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font: 10px var(--font-mono); }
    .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .result-row { width: 100%; min-height: 62px; padding: 10px 0; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--fg); display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; text-align: left; }
    .result-row:first-child { border-top: 0; }
    .result-thumb { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--fg-soft); }
    .segmented { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); }
    .segmented button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
    .segmented button.active { background: var(--surface); color: var(--fg); }
    .field-label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 12px; }
    .textarea { min-height: 90px; resize: vertical; }
    .danger { color: color-mix(in oklch, var(--accent) 45%, var(--fg)); }
    .sheet-foot { position: sticky; bottom: calc(-22px - var(--safe-bottom)); margin: 18px -18px calc(-22px - var(--safe-bottom)); padding: 14px 18px calc(18px + var(--safe-bottom)); border-top: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 94%, transparent); backdrop-filter: blur(18px); }
    .member-copy { position: relative; z-index: 2; max-width: 66%; }
    .member-figure { position: absolute; z-index: 1; right: 14px; bottom: -16px; width: 104px; height: 132px; border-radius: 48% 48% 22% 22%; background: linear-gradient(160deg, color-mix(in oklch, var(--fg) 30%, transparent), color-mix(in oklch, var(--accent) 45%, var(--surface))); box-shadow: 0 16px 30px color-mix(in oklch, var(--fg) 22%, transparent); }
    .member-figure::after { content: '3D'; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: color-mix(in oklch, var(--fg) 48%, transparent); font: 10px var(--font-mono); }
    .app.mine-theme { --bg: var(--mine-bg); --surface: var(--mine-surface); --fg: var(--mine-fg); --muted: var(--mine-muted); --border: var(--mine-border); --accent: var(--mine-accent); }
    .app.mine-theme .content { background: radial-gradient(circle at 82% 10%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 28%), linear-gradient(180deg, var(--mine-bg), color-mix(in oklch, var(--mine-bg) 72%, var(--surface))); }

    .overlay { position: absolute; inset: 0; z-index: 50; display: grid; align-items: end; background: color-mix(in oklch, black 62%, transparent); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet { max-height: 88%; overflow: auto; padding: 20px 18px calc(22px + var(--safe-bottom)); border-radius: 26px 26px 0 0; background: var(--surface); border-top: 1px solid var(--border); transform: translateY(18px); transition: transform .2s ease; }
    .overlay.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 38px; height: 4px; margin: -8px auto 18px; border-radius: 999px; background: var(--border); }
    .sheet h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }
    .sheet p { color: var(--muted); }
    .option { padding: 14px 0; border-top: 1px solid var(--border); }
    .option:first-of-type { border-top: 0; }
    .check { display: flex; align-items: flex-start; gap: 9px; margin: 12px 0; color: var(--muted); font-size: 12px; }
    .check input { margin-top: 3px; accent-color: var(--accent); }
    .input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--bg); color: var(--fg); outline: none; }
    .input:focus { border-color: var(--accent); }
    .close-sheet { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 50%; background: transparent; color: var(--fg); }

    .age-gate { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; padding: 28px 22px 24px; background: var(--bg); }
    .age-art { flex: 1; min-height: 250px; display: grid; place-items: center; position: relative; overflow: hidden; }
    .age-art::before { content: ''; width: 240px; height: 240px; border: 1px solid var(--border); border-radius: 50%; box-shadow: 0 0 80px var(--accent-soft); }
    .age-mark { position: absolute; font-family: var(--font-display); font-size: 68px; letter-spacing: -.07em; }
    .age-mark small { color: var(--accent); font: 16px var(--font-mono); letter-spacing: 0; vertical-align: top; }
    .age-gate h1 { font-family: var(--font-display); margin: 0; font-size: 28px; }
    .age-gate p { margin: 8px 0 18px; color: var(--muted); }
    .legal { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }
    .legal a { color: var(--fg); }
    .hidden { display: none !important; }
    .toast { position: absolute; left: 50%; bottom: 88px; z-index: 100; transform: translate(-50%, 12px); opacity: 0; padding: 9px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--fg); color: var(--bg); white-space: nowrap; transition: .2s ease; font-size: 12px; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 600px) {
      body { padding: 0; display: block; background: var(--bg); }
      .stage, .device { width: 100vw; height: 100dvh; }
      .stage { gap: 0; }
      .caption, .device > .rail, .device > .island { display: none; }
      .device { padding: 0; border-radius: 0; background: var(--bg); box-shadow: none; }
      .device::before, .device::after { display: none; }
      .screen { border-radius: 0; }
      .statusbar { display: none; }
      .home-indicator { display: none; }
      .tabbar { padding-bottom: var(--safe-bottom); }
    }

    @media (min-width: 601px) and (max-height: 900px) {
      .stage { transform: scale(.72); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    /* Document screenshot framework alignment - light dense portal + black short-feed */
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --fg: #11151b;
      --muted: #74808f;
      --border: #e4eaf1;
      --accent: #11151b;
      --brand: #139fd5;
      --violet: #7565ee;
      --yellow: #ffd84d;
      --font-display: 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      --font-body: 'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body { background: #eaf0f7; color: var(--fg); }
    .caption { color: #687483; }
    .caption strong { color: #11151b; }
    .device { background: #0b0e13; box-shadow: 0 30px 80px rgba(38,51,69,.22), inset 0 0 0 2px #05070a; }
    .screen, .app, .content { background: var(--bg); color: var(--fg); }
    .statusbar { background: #f7f9fc; color: #11151b; }
    .home-indicator { background: #fff; }
    .home-indicator::after { background: #11151b; }
    .screen.short-screen .statusbar { background: #05070a; color: #fff; }
    .screen.short-screen .home-indicator { background: #05070a; }
    .screen.short-screen .home-indicator::after { background: #fff; }

    .portal-page { min-height: 100%; background: #fff; }
    .portal-head {
      position: sticky; top: 0; z-index: 8; display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 8px; padding: 10px 11px 8px;
      background: linear-gradient(180deg,#dff9ff 0%,rgba(255,255,255,.96) 100%);
    }
    .brand-logo { font-weight: 950; font-style: italic; letter-spacing: -.08em; font-size: 18px; color:#10141a; white-space: nowrap; }
    .brand-logo i { color: #15a6d6; font-style: normal; }
    .search-pill { height: 34px; border: 0; border-radius: 18px; background: rgba(255,255,255,.86); color: #9aa4af; display:flex; align-items:center; gap:6px; padding:0 11px; text-align:left; font-size:11px; box-shadow: inset 0 0 0 1px rgba(18,39,55,.05); }
    .search-pill svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .publish-pill { height:34px; padding:0 11px; border:0; border-radius:18px; background:#101319; color:white; font-size:11px; font-weight:700; white-space:nowrap; }
    .publish-pill::before { content:'●'; margin-right:5px; font-size:8px; }

    .portal-tabs { display:flex; align-items:center; gap:19px; overflow:auto; padding:0 12px; height:36px; background:#fff; scrollbar-width:none; }
    .portal-tabs::-webkit-scrollbar { display:none; }
    .portal-tab { position:relative; flex:0 0 auto; border:0; background:none; padding:8px 0; color:#303844; font-size:12px; }
    .portal-tab.active { color:#11151b; font-weight:800; }
    .portal-tab.active::after { content:''; position:absolute; left:25%; right:25%; bottom:0; height:2px; border-radius:2px; background:#11151b; }
    .portal-tab.hot { color:#e15763; }

    .channel-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:9px 5px; padding:8px 10px 10px; background:#fff; }
    .channel-carousel { overflow-x:auto; overflow-y:hidden; padding:0 10px 10px; background:#fff; scrollbar-width:none; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; touch-action:pan-x; }
    .channel-carousel::-webkit-scrollbar { display:none; }
    .channel-carousel-track { display:flex; width:max-content; gap:5px; animation:channel-loop 16s ease-in-out infinite alternate; }
    .channel-carousel .channel { flex:0 0 58px; scroll-snap-align:start; }
    .channel { min-width:0; border:0; padding:0; background:none; color:#4b5663; text-align:center; font-size:9px; line-height:1.2; }
    .channel-cover { position:relative; display:block; width:100%; aspect-ratio:1.16/1; overflow:hidden; border-radius:7px; margin-bottom:4px; background:linear-gradient(145deg,var(--c1,#d9f2fb),var(--c2,#7358b0)); box-shadow:0 2px 5px rgba(36,55,75,.08); }
    .channel-cover::before { content:''; position:absolute; width:48%; height:88%; left:31%; top:18%; border-radius:45% 45% 17% 17%; background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(16,25,37,.35)); transform:rotate(5deg); }
    .channel-cover b { position:absolute; inset:auto 2px 3px; color:white; font-size:7px; text-shadow:0 1px 2px rgba(0,0,0,.55); white-space:nowrap; overflow:hidden; }
    .channel:nth-child(4n+1) .channel-cover { --c1:#f6c2b3; --c2:#905b8d; }
    .channel:nth-child(4n+2) .channel-cover { --c1:#9fe1db; --c2:#4c91bb; }
    .channel:nth-child(4n+3) .channel-cover { --c1:#c8b7ef; --c2:#4c3f83; }
    .channel:nth-child(4n) .channel-cover { --c1:#ffca5e; --c2:#e55b53; }

    .shortcut-row { display:grid; grid-template-columns:repeat(4,1fr); padding:9px 22px 11px; background:#fff; border-top:1px solid #f0f3f7; }
    .shortcut { border:0; background:none; color:#202731; font-size:10px; }
    .shortcut-icon { width:42px; height:42px; display:grid; place-items:center; margin:0 auto 4px; border-radius:13px; color:white; font-size:17px; font-weight:900; background:linear-gradient(145deg,#51c8ea,#7566ef); box-shadow:0 7px 15px rgba(75,116,196,.18); }
    .shortcut:nth-child(2) .shortcut-icon { background:linear-gradient(145deg,#ff89d2,#9764ea); }
    .shortcut:nth-child(3) .shortcut-icon { background:linear-gradient(145deg,#ffc34d,#f07d5b); }
    .shortcut:nth-child(4) .shortcut-icon { background:linear-gradient(145deg,#55d4f0,#8d72ed); }

    .dense-section { padding:0 10px 13px; background:#fff; }
    .dense-title { display:flex; align-items:center; justify-content:space-between; min-height:34px; font-size:13px; }
    .dense-title strong { font-size:14px; }
    .dense-title span { color:#9aa3ad; font-size:10px; }
    .discovery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding-bottom:12px; }
    .discovery-card { min-height:58px; padding:9px 8px; border:0; border-radius:8px; color:#27303b; text-align:left; background:linear-gradient(145deg,#eefbff,#f2efff); }
    .discovery-card:nth-child(3n+2) { background:linear-gradient(145deg,#fff6df,#fff0f1); }
    .discovery-card:nth-child(3n) { background:linear-gradient(145deg,#ebfff4,#eef6ff); }
    .discovery-card strong { display:block; font-size:11px; }
    .discovery-card span { display:block; margin-top:4px; color:#8995a3; font-size:8px; }
    .tiny-filters { display:flex; gap:18px; overflow:auto; height:35px; align-items:center; border-top:1px solid #edf1f5; border-bottom:1px solid #edf1f5; scrollbar-width:none; }
    .tiny-filter { border:0; background:none; padding:8px 0; color:#434c58; font-size:11px; white-space:nowrap; }
    .tiny-filter.active { color:#12161c; font-weight:800; border-bottom:2px solid #12161c; }
    .media-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px 7px; }
    .media-card { min-width:0; background:white; color:#171b21; }
    .media-card-main { display:block; width:100%; border:0; padding:0; background:none; color:inherit; text-align:left; }
    .media-thumb { position:relative; display:block; width:100%; aspect-ratio:1.62; overflow:hidden; border-radius:3px; background:linear-gradient(145deg,var(--p1,#b5dce9),var(--p2,#60699b)); }
    .media-thumb::before { content:''; position:absolute; width:52%; height:110%; left:28%; top:15%; border-radius:44% 44% 15% 15%; background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(33,36,48,.42)); transform:rotate(-7deg); }
    .media-card:nth-child(3n+2) .media-thumb { --p1:#f7c79a; --p2:#a54c59; }
    .media-card:nth-child(3n) .media-thumb { --p1:#a8d5bf; --p2:#4e587c; }
    .media-badge { position:absolute; top:4px; right:4px; z-index:2; padding:2px 5px; border-radius:3px; background:#fff3b4; color:#9f6b00; font-size:7px; }
    .media-duration { position:absolute; right:4px; bottom:3px; z-index:2; padding:1px 4px; border-radius:2px; background:rgba(0,0,0,.62); color:white; font-size:7px; }
    .media-name { display:block; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; font-weight:650; }
    .media-meta { display:flex; justify-content:space-between; margin-top:2px; color:#929ba6; font-size:8px; }
    .media-author-link { display:flex; align-items:center; gap:4px; max-width:100%; margin-top:4px; padding:0; border:0; background:none; color:#7c8794; font-size:8px; text-align:left; }
    .media-author-link::before { content:''; flex:0 0 13px; width:13px; height:13px; border-radius:50%; background:linear-gradient(145deg,#79cce6,#695aa1); }
    .ad-matrix { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin:3px 0 8px; }
    .ad-tile { min-height:35px; display:grid; place-items:center; padding:3px; border-radius:3px; background:linear-gradient(145deg,#39424c,#15181d); color:white; font-size:9px; text-align:center; }
    .ad-label { position:absolute; left:4px; top:4px; z-index:2; color:white; font-size:7px; opacity:.85; }

    .short-theme, .short-theme .content { background:#05070a; color:white; }
    .short-theme .tabbar { background:#05070a; border-top-color:#252a32; }
    .short-theme .tab { color:#88919d; }
    .short-theme .tab.active { color:white; }
    .short-theme .video-stage { min-height:620px; background:#080b10; }
    .short-theme .top-tabs { justify-content:center; padding:0 46px 6px; background:#05070a; }
    .short-theme .top-tab { color:#c8ccd2; }
    .short-theme .top-tab.active { color:white; border-color:white; }
    .short-theme .placeholder { background:linear-gradient(145deg,#38404b,#0e1117); }
    .short-theme .placeholder::before { background:linear-gradient(180deg,#b4aeb0,#333746); }
    .short-theme .video-copy { bottom:16px; }
    .short-theme .action { color:white; text-shadow:0 1px 3px rgba(0,0,0,.8); }
    .short-theme .action-avatar { border-color:rgba(255,255,255,.7); background:rgba(255,255,255,.2); }
    .short-theme .btn-primary { min-height:32px; padding:7px 12px; border-radius:16px; background:white; color:#11151b; font-size:10px; }
    .short-theme .badge { background:rgba(0,0,0,.58); color:white; border-color:rgba(255,255,255,.35); }
    .short-feed-nav { display:grid; grid-template-columns:76px minmax(0,1fr) 76px; align-items:center; min-height:48px; background:#05070a; }
    .short-feed-nav > button { width:38px; height:38px; display:grid; place-items:center; border:0; background:none; color:white; font-size:28px; }
    .short-feed-nav > button svg, .short-nav-actions button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; }
    .short-feed-nav .top-tabs { min-width:0; padding:0; gap:18px; }
    .short-nav-actions { display:flex; align-items:center; justify-content:flex-end; gap:2px; padding-right:4px; }
    .short-nav-actions button { width:34px; height:42px; display:grid; place-items:center; align-content:center; gap:1px; padding:0; border:0; background:none; color:white; }
    .short-theme [data-od-id="short-video-feed"] { min-height:100%; display:flex; flex-direction:column; }
    .short-theme .video-stage { flex:1; min-height:0; }

    .ai-hero-list { padding:10px; background:#fff; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .ai-hero { position:relative; aspect-ratio:1; min-width:0; overflow:hidden; border:0; border-radius:10px; padding:13px 12px; display:flex; flex-direction:column; justify-content:flex-end; background:linear-gradient(145deg,#e4e0ff,#c8eff6); color:#5d47bd; text-align:left; box-shadow:inset 0 0 0 1px rgba(100,82,190,.06); }
    .ai-hero:nth-child(2) { background:linear-gradient(145deg,#dff4ff,#d9e5ff); color:#286da9; }

      if(action==='player-toggle'){const item=catalog[state.contentId];if(!hasAccess(item))return openPaywall(item);if(state.player.status==='loading')return toast('正在加载，请稍候');if(state.player.status==='playing'){stopPlaybackClock();state.player.status='paused';render();toast('已暂停并记录进度');}else startPlayback(item);}
      if(action==='player-quality'){state.player.quality=state.player.quality==='高清'?'超清':'高清';render();toast(`已切换${state.player.quality}`);}
      if(action==='player-line'){state.player.line=state.player.line%3+1;if(hasAccess(catalog[state.contentId])&&state.player.status==='playing')startPlayback(catalog[state.contentId]);else{render();toast(`已切换线路${state.player.line}，播放进度已保留`);}}
      if(action==='player-speed'){const speeds=[1,1.25,1.5,2],i=speeds.indexOf(state.player.speed);state.player.speed=speeds[(i+1)%speeds.length];render();toast(`倍速 ${state.player.speed.toFixed(2)}×`);}
      if(action==='player-mute'){state.player.muted=!state.player.muted;render();toast(state.player.muted?'已静音':'声音已恢复');}
      if(action==='player-fullscreen'){state.player.fullscreen=!state.player.fullscreen;render();toast(state.player.fullscreen?'已进入全屏':'已退出全屏');}
      if(action==='focus-comments'){document.querySelector('#videoComments')?.scrollIntoView({behavior:'smooth'});}
      if(action==='focus-post-comments'){document.querySelector('#postComments')?.scrollIntoView({behavior:'smooth'});}
      if(action==='submit-comment')submitComment(target.dataset.kind);
      if(action==='follow')ensureLogin(()=>toast('已关注，可在“我的关注”查看'));
      if(action==='favorite')ensureLogin(()=>toast('已收藏，可在“我的收藏”查看'));
      if(action==='login')state.loggedIn?openPrivacy():openLogin();
      if(action==='membership')openMembership();
      if(action==='wallet')ensureLogin(openWallet);
      if(action==='select-plan')ensureLogin(()=>{const plan=plans[target.dataset.plan];if(!plan)return toast('方案配置异常，请刷新');openOrder({type:'member',title:plan.name,amount:plan.amount,plan,scope:`${plan.period} · ${plan.scope}`});});
      if(action==='buy-pack')ensureLogin(()=>openOrder({type:'coins',title:`充值${target.dataset.coins}金币`,amount:Number(target.dataset.amount),coins:Number(target.dataset.coins),scope:'付费金币余额'}));
      if(action==='unlock-content'){const item=catalog[target.dataset.id],cost=hasCoinDiscount()?item.discount:item.price,allocation=getContentAllocation(cost);if(state.purchased.has(item.id))return toast('已购买，禁止重复扣费');if(allocation.shortage)return ensureLogin(openWallet);ensureLogin(()=>openOrder({type:'unlock',title:`解锁：${item.title}`,amount:0,asset:true,item,cost,allocation,scope:'当前精品内容'}));}
      if(action==='confirm-order'){if(!document.querySelector('#orderConsent')?.checked)return toast('请先确认订单规则');showOrderProcessing();}
      if(action==='query-order')grantOrder();
      if(action==='finish-order'){const completed=state.pending;if(!completed)return toast('订单已处理');closeSheet();state.pending=null;const item=state.screen==='detail'?catalog[state.contentId]:null;if(item&&hasAccess(item)&&(completed.type==='unlock'||completed.type==='member')){state.player.status='paused';state.player.current=Math.max(state.player.current,item.trial||0);startPlayback(item);}else{render();toast(completed.type==='coins'?'余额已更新':'会员权益已更新');}}
      if(action==='ai-tool')openAITool(target.dataset.tool,Number(target.dataset.cost));
      if(action==='select-material'){state.aiDraft.materialReady=true;renderAIToolSheet();toast('素材上传成功，已完成预检');}
      if(action==='submit-ai'){if(!state.aiDraft.materialReady)return toast('请先上传并通过素材预检');if(!document.querySelector('#aiConsent')?.checked)return toast('请先完成素材授权确认');const task=createAITask(target.dataset.tool,Number(target.dataset.cost));if(!task)return;closeSheet();render();toast('已开始生成，可离开页面等待通知');}
      if(action==='task-record')state.tasks.length?openTaskDetail(state.tasks.at(-1).id):toast('暂无AI任务');
      if(action==='task-detail')openTaskDetail(target.dataset.id);
      if(action==='ai-exception')openAIException(target.dataset.id);
      if(action==='apply-ai-exception'){const t=state.tasks.find(x=>x.id===target.dataset.id);if(!t||t.status!=='生成中')return toast('任务状态已变化，请刷新');const map={generation:['生成失败','模型未产生可用结果，请调整素材或参数后重试。'],timeout:['超时已退回','任务超过处理时限，资产已退回，可直接重新生成。'],review:['处理拒绝已退回','生成结果未通过安全处理，请修改素材后重新提交。']},result=map[target.dataset.kind];refundAITask(t,result[0],result[1]);closeSheet();render();openTaskDetail(t.id);toast(`${result[0]}，冻结资产已原路退回`);}
      if(action==='ai-appeal')openSheet(`${sheetTitle('AI处理申诉',`${target.dataset.id} · 提交后进入人工复核`)}<label class="field-label">申诉说明</label><textarea class="input textarea" placeholder="说明素材授权、人物成年情况与异议理由"></textarea><div class="notice">申诉不恢复已拦截结果；复核结论将通过消息中心反馈。</div><button class="btn-primary" data-action="submit-ai-appeal">提交申诉</button>`);
      if(action==='submit-ai-appeal'){closeSheet();toast('申诉已提交，复核结果将通过消息反馈');}
      if(action==='complete-ai'){const t=state.tasks.find(x=>x.id===target.dataset.id);if(!t||t.status!=='生成中')return toast('任务状态已变化，请刷新');state.frozen=Math.max(0,state.frozen-t.cost);t.status='成功';t.completedAt='刚刚';state.aiNotifications.unshift({taskId:t.id,tool:t.tool,read:false,time:'刚刚'});closeSheet();render();toast('生成成功，已发送站内通知');}
      if(action==='retry-ai'||action==='regenerate-ai'){const source=state.tasks.find(x=>x.id===target.dataset.id);if(!source)return toast('未找到原任务');const task=createAITask(source.tool,source.cost,source.id);if(!task)return;closeSheet();render();openTaskDetail(task.id);toast(action==='retry-ai'?'已重新提交生成':'已创建新的生成任务');}
      if(action==='view-ai-result')openAIResult(target.dataset.id);
      if(action==='safety-menu')openSafetyMenu();
      if(action==='post-menu')openPostMenu();
      if(action==='not-interested'){closeSheet();toast('已减少相似内容推荐');}
      if(action==='report')openReport();
      if(action==='submit-report'){closeSheet();toast('举报已进入处理，结果将通过消息反馈');}
      if(action==='block'){closeSheet();toast('已拉黑该账号，后续不再展示');}
      if(action==='publish')openPublish();
      if(action==='select-topic'){state.postDraft.topic=target.dataset.value;document.querySelectorAll('.topic-option').forEach(button=>button.classList.toggle('active',button===target));}
      if(action==='add-post-media'){const kind=target.dataset.kind;state.postDraft[kind]=!state.postDraft[kind];target.classList.toggle('active',state.postDraft[kind]);target.textContent=state.postDraft[kind]?(kind==='image'?'✓ 已添加图片':'✓ 已添加视频'):(kind==='image'?'＋ 添加图片':'▶ 添加视频');}
      if(action==='submit-post'){if(!document.querySelector('#postConsent')?.checked)return toast('请先同意社区规范');const title=document.querySelector('#postTitle')?.value.trim()||'',body=document.querySelector('#postBody')?.value.trim()||'';if(title.length<5)return toast('标题至少 5 个字');if(!body&&!state.postDraft.image&&!state.postDraft.video)return toast('请填写内容或添加图片/视频');state.posts.unshift({title:title.slice(0,60),body:body.slice(0,2000),topic:state.postDraft.topic,image:state.postDraft.image,video:state.postDraft.video,status:'处理中'});state.postDraft={topic:'影评',image:false,video:false,title:'',body:''};state.navigationStack=[];state.screen='main';state.tab='community';render();toast('已提交处理，尚未公开');}
      if(action==='search')openSearch();
      if(action==='run-search'){const q=document.querySelector('#searchInput').value.trim(),safeQ=escapeHTML(q),box=document.querySelector('#searchResults');if(!q)return toast('请输入搜索内容');box.innerHTML=q.includes('不存在')?`<div class="notice" style="margin-top:18px;">未找到“${safeQ}”。已记录无结果词，可尝试其他关键词或查看热门内容。</div>`:`<p class="eyebrow" style="margin-top:18px;">“${safeQ}”的搜索结果</p><button class="result-row" data-action="open-detail" data-id="set1"><span class="result-thumb"></span><span><strong>经典系列完整合集</strong><span class="meta" style="display:block;">合集 · 120金币 · 12集</span></span><span>›</span></button><button class="result-row"><span class="result-thumb"></span><span><strong>#${safeQ}</strong><span class="meta" style="display:block;">标签 · 36条内容</span></span><span>›</span></button>`;}
      if(action==='message')openMessages();
      if(action==='comments')openComments(state.tab==='community'?'community':'video');
      if(action==='orders')openOrders();
      if(action==='order-detail')openOrderDetail(target.dataset.id);
      if(action==='request-refund')requestRefund(target.dataset.id);
      if(action==='settle-refund')settleRefund(target.dataset.id,target.dataset.result==='approve');
      if(action==='watch-records')openWatchRecords();
      if(action==='support')ensureLogin(()=>openSheet(`${sheetTitle('客服与帮助','可查询订单、权益、流水、AI任务和处理结果')}<div class="notice" style="margin-top:16px;">提交问题时将自动附带业务单号与当前状态，不允许客服直接修改资产。</div><button class="btn-primary" style="margin-top:12px;">发起客服工单</button>`));
      if(action==='privacy')openPrivacy();
    });
    document.addEventListener('input',e=>{if(e.target.id==='postTitle')state.postDraft.title=e.target.value;if(e.target.id==='postBody')state.postDraft.body=e.target.value;if(e.target.id==='profileSearch'){state.profileQuery=e.target.value;const results=document.querySelector('#profileResults');if(results)results.innerHTML=profileResultsMarkup();}});
    document.addEventListener('input',e=>{const seek=e.target.closest('[data-action="player-seek"]');if(!seek)return;state.player.current=Number(seek.value);seek.style.setProperty('--progress',`${Number(seek.value)/Number(seek.max)*100}%`);const time=seek.parentElement.querySelector('.player-time');if(time)time.textContent=`${formatTime(state.player.current)} / ${catalog[state.contentId].duration}`;});
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet();});
    render();
  </script>
</body>
</html>
