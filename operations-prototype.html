<html lang="zh-CN" class="prototype-mode">
<head>
  <meta charset="utf-8" />

      document.documentElement.classList.add('prototype-mode');
      document.title='基咔 · 运营验收原型';
    }
  </script>
  <style>
    :root {
      --bg: #070a10;
      --surface: #111721;
      --fg: #f5f1e8;
      --muted: #929baa;
      --border: #27303c;
      --accent: #e2b45f;
      --mine-bg: #dcecff;
      --mine-surface: #f4f9ff;
      --mine-fg: #0b1d36;
      --mine-muted: #55708f;
      --mine-border: #b9d1ec;
      --mine-accent: #efbd48;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 7%, transparent);
      --font-display: 'Songti SC', 'STSong', 'Iowan Old Style', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(20,159,213,.32); outline-offset: 2px; }
    button:active { transform: scale(.985); }
    body {
      min-height: 100vh;
      background:
        radial-gradient(55% 80% at 50% 0%, color-mix(in oklch, var(--accent) 7%, var(--bg)), var(--bg) 62%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.45;
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .caption {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      padding: 10px;
      border-radius: 54px;
      background: color-mix(in oklch, var(--surface) 76%, black);
      box-shadow: 0 30px 80px color-mix(in oklch, black 60%, transparent), inset 0 0 0 2px black;
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      top: 116px;
      bottom: 108px;
      width: 3px;
      background: color-mix(in oklch, var(--fg) 9%, black);
    }
    .device::before { left: -2px; }
    .device::after { right: -2px; }
    .rail { position: absolute; width: 4px; border-radius: 3px; background: black; }
    .rail.silent { left: -3px; top: 176px; height: 30px; }
    .rail.up { left: -3px; top: 220px; height: 58px; }
    .rail.down { left: -3px; top: 288px; height: 58px; }
    .rail.power { right: -3px; top: 246px; height: 98px; }
    .island {
      position: absolute;
      top: 20px;
      left: 50%;
      width: 122px;
      height: 35px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: black;
      z-index: 30;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 44px;
      background: var(--bg);
    }
    .statusbar {
      position: relative;
      z-index: 20;
      flex: 0 0 47px;
      padding: 17px 24px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 650;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 5px; }
    .statusbar svg { width: 16px; height: 11px; fill: currentColor; }
    .statusbar .battery { width: 24px; }
    .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .content { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .content::-webkit-scrollbar { display: none; }
    .home-indicator { flex: 0 0 calc(20px + var(--safe-bottom)); position: relative; z-index: 20; background: var(--surface); }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: calc(6px + var(--safe-bottom));
      width: 132px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--fg);
    }

    .pad { padding-inline: 18px; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header { padding: 10px 18px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header h1, .h1, .h2 { font-family: var(--font-display); margin: 0; letter-spacing: -.02em; }
    .header h1, .h1 { font-size: 25px; line-height: 1.1; }
    .h2 { font-size: 20px; line-height: 1.2; }
    .h3 { font-size: 15px; font-weight: 650; margin: 0; }
    .meta { color: var(--muted); font-size: 12px; }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font: 10px/1.4 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; }
    .icon-btn {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--fg);
    }
    .icon-btn svg, .tab svg, .action svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }

    .tabs, .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
    .top-tabs { padding: 2px 18px 11px; gap: 20px; }
    .top-tab {
      min-height: 44px;
      padding: 12px 0 8px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
    }
    .top-tab.active { color: var(--fg); border-color: var(--accent); font-weight: 650; }
    .chip {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip.active { color: var(--fg); border-color: var(--fg); }

    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .card-pad { padding: 16px; }
    .placeholder {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 22%, var(--accent-soft), transparent 28%),
        linear-gradient(145deg, color-mix(in oklch, var(--surface) 65%, var(--bg)), var(--surface));
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .placeholder::before {
      content: '';
      width: 42%;
      aspect-ratio: 3/4;
      border-radius: 46% 46% 20% 20%;
      background: linear-gradient(180deg, color-mix(in oklch, var(--fg) 26%, transparent), color-mix(in oklch, var(--fg) 5%, transparent));
      filter: blur(.2px);
    }
    .placeholder span { position: absolute; bottom: 12px; font: 10px var(--font-mono); letter-spacing: .08em; }
    .ratio-video { aspect-ratio: 16/10; }
    .ratio-poster { aspect-ratio: 3/4; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--bg) 78%, transparent);
      border: 1px solid color-mix(in oklch, var(--fg) 20%, transparent);
      color: var(--fg);
      font: 10px var(--font-mono);
    }
    .btn-primary, .btn-secondary {
      min-height: 48px;
      width: 100%;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 650;
    }
    .btn-primary { border: 0; background: var(--accent); color: var(--bg); }
    .btn-secondary { border: 1px solid var(--border); background: transparent; color: var(--fg); }

    .video-stage { position: relative; min-height: 598px; background: var(--surface); overflow: hidden; }
    .video-stage .placeholder { position: absolute; inset: 0; border: 0; }
    .video-stage .placeholder::before { width: 72%; transform: translateY(28px); }
    .video-shade { position: absolute; inset: 30% 0 0; background: linear-gradient(transparent, color-mix(in oklch, var(--bg) 94%, transparent)); }
    .video-copy { position: absolute; left: 18px; right: 72px; bottom: 20px; z-index: 2; }
    .video-copy p { margin: 6px 0 0; color: color-mix(in oklch, var(--fg) 82%, var(--muted)); }
    .short-author-link { display:block; width:max-content; max-width:100%; padding:0; border:0; background:none; color:inherit; text-align:left; }
    .short-author-link .h3 { margin:0; }
    .trial { position: absolute; top: 16px; left: 18px; z-index: 3; }
    .action-rail { position: absolute; right: 12px; bottom: 94px; z-index: 3; display: flex; flex-direction: column; gap: 16px; }
    .action { width: 48px; min-height: 48px; border: 0; background: transparent; color: var(--fg); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; }
    .action svg { width:27px; height:27px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .action .fill { fill:currentColor; stroke:none; }
    .action.is-liked { color:#ff6278; }
    .action.is-liked svg { fill:#ff6278; }
    .action.is-playing svg { color:#72d7ff; }
    .action-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--fg-soft); border: 1px solid var(--border); }
    .short-center-play { position:absolute; left:50%; top:50%; z-index:7; width:66px; height:66px; display:grid; place-items:center; transform:translate(-50%,-50%); border:1px solid rgba(255,255,255,.42); border-radius:50%; background:rgba(8,12,18,.58); color:#fff; box-shadow:0 12px 36px rgba(0,0,0,.3); backdrop-filter:blur(10px); }
    .short-center-play svg { width:31px; height:31px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .short-center-play:active { transform:translate(-50%,-50%) scale(.94); }
    .short-clean-restore { display:none; position:absolute; inset:0; z-index:9; border:0; background:transparent; color:transparent; touch-action:pan-y; }
    .short-video-slide.is-trial-ended .video-copy,
    .short-video-slide.is-trial-ended .action-rail { opacity:.16; filter:blur(1px); pointer-events:none; }
    .short-trial-mask { position:absolute; inset:0; z-index:6; display:grid; place-items:center; padding:76px 28px 96px; pointer-events:none; background:radial-gradient(circle at 50% 42%,rgba(18,31,45,.18),rgba(3,7,12,.72) 58%,rgba(3,7,12,.92)); }
    .short-trial-mask-card { width:min(100%,310px); padding:25px 22px 20px; border:1px solid rgba(255,255,255,.18); border-radius:25px; background:rgba(12,18,25,.82); color:#fff; text-align:center; box-shadow:0 26px 70px rgba(0,0,0,.42); backdrop-filter:blur(20px); }
    .short-trial-mask-lock { width:52px; height:52px; display:grid; place-items:center; margin:0 auto 12px; border-radius:17px; background:linear-gradient(145deg,#dff6ff,#87d4f3); color:#137faa; box-shadow:0 12px 30px rgba(30,123,164,.22); }
    .short-trial-mask-lock svg { width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .short-trial-mask-card small { display:block; color:#75d0f6; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .short-trial-mask-card h2 { margin:8px 0 6px; font-size:24px; letter-spacing:-.04em; }
    .short-trial-mask-card p { margin:0 auto 17px; max-width:250px; color:rgba(255,255,255,.68); font-size:11px; line-height:1.65; }
    .short-trial-mask-cta { width:100%; min-height:46px; pointer-events:auto; border:0; border-radius:15px; background:linear-gradient(135deg,#f7fbff,#c9efff); color:#0b2230; font-size:13px; font-weight:800; box-shadow:0 12px 30px rgba(48,169,218,.2); }
    .short-trial-mask-cta:active { transform:scale(.98); }
    .short-trial-swipe { display:flex; align-items:center; justify-content:center; gap:5px; margin-top:14px; color:rgba(255,255,255,.55); font-size:10px; }
    .short-trial-swipe::before { content:'↑'; color:#75d0f6; font-size:15px; }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(18px);
    }
    .tab { min-height: 58px; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 9px; }
    .tab.active { color: var(--accent); }

    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .poster .placeholder { aspect-ratio: 4/5; }
    .poster-body { padding: 10px; }
    .poster-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .poster-meta { margin-top: 5px; display: flex; justify-content: space-between; color: var(--muted); font: 10px var(--font-mono); }
    .section-title { margin: 20px 0 10px; }

    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .tool { min-height: 128px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--fg); text-align: left; }
    .tool-mark { width: 34px; height: 34px; margin-bottom: 22px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); }
    .tool-mark svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .tool p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .post { padding: 15px 0; border-top: 1px solid var(--border); }
    .post:first-child { border-top: 0; }
    .avatar { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background: var(--fg-soft); border: 1px solid var(--border); }
    .post p { margin: 10px 0; }
    .post-media { height: 146px; border: 1px solid var(--border); border-radius: 14px; background: linear-gradient(145deg, var(--surface), var(--fg-soft)); }
    .post-actions { margin-top: 10px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

    .profile-head { padding: 8px 18px 18px; }
    .member-banner {
      position: relative;
      min-height: 138px;
      padding: 18px;
      border: 1px solid color-mix(in oklch, var(--fg) 15%, var(--border));
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 18%, color-mix(in oklch, var(--accent) 18%, transparent), transparent 28%),
        linear-gradient(135deg, color-mix(in oklch, var(--surface) 78%, var(--accent)), var(--surface));
    }
    .member-banner::after { content: ''; position: absolute; right: -20px; bottom: -44px; width: 150px; height: 150px; border: 1px solid color-mix(in oklch, var(--fg) 16%, transparent); border-radius: 50%; }
    .member-banner p { margin: 6px 0 18px; color: var(--muted); }
    .mini-cta { position: relative; z-index: 1; min-height: 40px; padding: 9px 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 650; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .asset { padding: 13px 8px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); text-align: center; }
    .asset::before { content: ''; display: block; width: 24px; height: 24px; margin: 0 auto 6px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, var(--surface), var(--accent) 35%, color-mix(in oklch, var(--accent) 45%, var(--fg))); box-shadow: 0 7px 14px var(--accent-soft); }
    .asset strong { display: block; font: 18px var(--font-mono); }
    .asset span { color: var(--muted); font-size: 10px; }
    .menu { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .menu-row { width: 100%; min-height: 50px; padding: 0 15px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--fg); display: flex; align-items: center; justify-content: space-between; text-align: left; }
    .menu-row:first-child { border-top: 0; }

    .backbar { min-height: 52px; padding: 4px 12px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); }
    .backbar strong { text-align: center; font-family: var(--font-display); font-size: 17px; }
    .back-btn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--fg); font-size: 24px; }
    .notice { padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--fg-soft); color: var(--muted); font-size: 12px; }
    .notice strong { color: var(--fg); }
    .post-video-progress span::after,
    .record-media-progress i::after,
    .collection-progress span::after,
    .launch-progress span::after { content:''; position:absolute; right:-4px; top:50%; width:9px; height:9px; border:2px solid rgba(255,255,255,.92); border-radius:50%; background:currentColor; box-shadow:0 1px 5px rgba(16,30,45,.28); transform:translateY(-50%); }
    .detail-player { position:relative; aspect-ratio:16/10; background:#05070a; color:white; overflow:hidden; isolation:isolate; }
    .detail-player .placeholder { position: absolute; inset: 0; border: 0; }
    .detail-player.is-fullscreen { position:absolute; inset:0; z-index:45; aspect-ratio:auto; }
    .detail-player.is-fullscreen .placeholder::before { width:45%; }
    .player-visual { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 52% 26%,#4b5969 0,#1f252d 31%,#06080b 78%); }
    .player-tap-target { position:absolute; inset:0; z-index:2; width:100%; height:100%; border:0; background:transparent; cursor:pointer; }
    .player-visual::before { content:''; position:absolute; width:42%; height:105%; left:30%; top:9%; border-radius:48% 48% 17% 17%; background:linear-gradient(180deg,rgba(239,242,246,.72),rgba(34,40,50,.42)); transform:rotate(-5deg); }
    .player-visual::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 42%,rgba(0,0,0,.72)); }
    .player-loading { position:absolute; inset:0; z-index:5; display:grid; place-items:center; background:rgba(1,3,6,.46); }
    .loading-ring { width:38px; height:38px; border:3px solid rgba(255,255,255,.24); border-top-color:white; border-radius:50%; animation:player-spin .72s linear infinite; }
    .loading-copy { position:absolute; top:calc(50% + 30px); font-size:10px; color:rgba(255,255,255,.74); }
    @keyframes player-spin { to { transform:rotate(360deg); } }
    .player-center { position:absolute; left:calc(50% - 29px); top:calc(50% - 29px); z-index:8; width:58px; height:58px; border:1px solid rgba(255,255,255,.28); border-radius:50%; background:rgba(0,0,0,.46); color:white; display:grid; place-items:center; backdrop-filter:blur(10px); pointer-events:auto; }
    .player-center svg { width:25px; height:25px; fill:currentColor; stroke:currentColor; }
    .player-ui { position:absolute; left:0; right:0; bottom:0; z-index:6; padding:34px 12px 9px; background:linear-gradient(transparent,rgba(0,0,0,.88)); }
    .progress-line { position:absolute; left:0; right:0; bottom:-2px; z-index:12; width:100%; height:17px; margin:0; appearance:none; background:transparent; cursor:pointer; }
    .progress-line::-webkit-slider-runnable-track { height:3px; border-radius:4px; background:linear-gradient(90deg,var(--accent) 0 var(--progress),rgba(255,255,255,.38) var(--progress)); }
    .progress-line::-webkit-slider-thumb { appearance:none; width:13px; height:13px; margin-top:-5px; border:2px solid rgba(255,255,255,.96); border-radius:50%; background:var(--accent); box-shadow:0 1px 6px rgba(0,0,0,.34); }
    .progress-line::-moz-range-track { height:3px; border-radius:4px; background:rgba(255,255,255,.38); }
    .progress-line::-moz-range-progress { height:3px; border-radius:4px; background:var(--accent); }
    .progress-line::-moz-range-thumb { width:13px; height:13px; border:2px solid rgba(255,255,255,.96); border-radius:50%; background:var(--accent); box-shadow:0 1px 6px rgba(0,0,0,.34); }
    .player-progress { display:block; width:100%; height:20px; margin:0; appearance:none; background:transparent; cursor:pointer; }
    .player-progress::-webkit-slider-runnable-track { height:3px; border-radius:4px; background:linear-gradient(90deg,#25b6e7 0 var(--progress),rgba(255,255,255,.32) var(--progress)); }
    .player-progress::-webkit-slider-thumb { appearance:none; width:15px; height:15px; margin-top:-6px; border:2px solid white; border-radius:50%; background:#25b6e7; box-shadow:0 0 0 4px rgba(37,182,231,.26); }
    .player-progress::-moz-range-track { height:3px; border-radius:4px; background:rgba(255,255,255,.32); }
    .player-progress::-moz-range-progress { height:3px; border-radius:4px; background:#25b6e7; }
    .player-progress::-moz-range-thumb { width:15px; height:15px; border:2px solid white; border-radius:50%; background:#25b6e7; box-shadow:0 0 0 4px rgba(37,182,231,.26); }
    .player-bar { display:flex; align-items:center; gap:7px; min-height:30px; }

    @media (max-width: 600px) {
      body { padding: 0; display: block; background: var(--bg); }
      .stage, .device { width: 100vw; height: 100dvh; }
      .stage { gap: 0; }
      .caption, .device > .rail, .device > .island { display: none; }
      .device { padding: 0; border-radius: 0; background: var(--bg); box-shadow: none; }
      .device::before, .device::after { display: none; }
      .screen { border-radius: 0; }
      .statusbar { display: none; }
      .home-indicator { display: none; }
      .tabbar { padding-bottom: var(--safe-bottom); }
    }

    @media (min-width: 601px) and (max-height: 900px) {
      .stage { transform: scale(.72); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }

    /* Document screenshot framework alignment - light dense portal + black short-feed */
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --fg: #11151b;
      --muted: #74808f;
      --border: #e4eaf1;
      --accent: #11151b;
      --brand: #139fd5;
      --violet: #7565ee;
      --yellow: #ffd84d;
      --font-display: 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      --font-body: 'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body { background: #eaf0f7; color: var(--fg); }
    .caption { color: #687483; }
    .caption strong { color: #11151b; }
    .device { background: #0b0e13; box-shadow: 0 30px 80px rgba(38,51,69,.22), inset 0 0 0 2px #05070a; }
    .screen, .app, .content { background: var(--bg); color: var(--fg); }
    .statusbar { background: #f7f9fc; color: #11151b; }
    .home-indicator { background: #fff; }
    .home-indicator::after { background: #11151b; }
    .screen.short-screen .statusbar { background: #05070a; color: #fff; }
    .screen.short-screen .home-indicator { background: #05070a; }
    .screen.short-screen .home-indicator::after { background: #fff; }

    .portal-page { min-height: 100%; background: #fff; }
    .portal-head {
      position: sticky; top: 0; z-index: 8; display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 8px; padding: 10px 11px 8px;
      background: linear-gradient(180deg,#dff9ff 0%,rgba(255,255,255,.96) 100%);
    }

    .brand-logo i { color: #15a6d6; font-style: normal; }
    .search-pill { height: 34px; border: 0; border-radius: 18px; background: rgba(255,255,255,.86); color: #9aa4af; display:flex; align-items:center; gap:6px; padding:0 11px; text-align:left; font-size:11px; box-shadow: inset 0 0 0 1px rgba(18,39,55,.05); }
    .search-pill svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; }

    .publish-pill::before { content:'●'; margin-right:5px; font-size:8px; }

    .portal-tab.hot { color:#e15763; }

    .channel-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:9px 5px; padding:8px 10px 10px; background:#fff; }
    .channel-carousel { overflow-x:auto; overflow-y:hidden; padding:0 10px 10px; background:#fff; scrollbar-width:none; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; touch-action:pan-x; }
    .channel-carousel::-webkit-scrollbar { display:none; }
    .channel-carousel-track { display:flex; width:max-content; gap:5px; animation:channel-loop 16s ease-in-out infinite alternate; }
    .channel-carousel .channel { flex:0 0 58px; scroll-snap-align:start; }

    .channel-cover { position:relative; display:block; width:100%; aspect-ratio:1.16/1; overflow:hidden; border-radius:7px; margin-bottom:4px; background:linear-gradient(145deg,var(--c1,#d9f2fb),var(--c2,#7358b0)); box-shadow:0 2px 5px rgba(36,55,75,.08); }
    .channel-cover::before { content:''; position:absolute; width:48%; height:88%; left:31%; top:18%; border-radius:45% 45% 17% 17%; background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(16,25,37,.35)); transform:rotate(5deg); }

    .shortcut { border:0; background:none; color:#202731; font-size:10px; }
    .shortcut-icon { width:42px; height:42px; display:grid; place-items:center; margin:0 auto 4px; border-radius:13px; color:white; font-size:17px; font-weight:900; background:linear-gradient(145deg,#51c8ea,#7566ef); box-shadow:0 7px 15px rgba(75,116,196,.18); }
    .shortcut:nth-child(2) .shortcut-icon { background:linear-gradient(145deg,#ff89d2,#9764ea); }
    .shortcut:nth-child(3) .shortcut-icon { background:linear-gradient(145deg,#ffc34d,#f07d5b); }
    .shortcut:nth-child(4) .shortcut-icon { background:linear-gradient(145deg,#55d4f0,#8d72ed); }

    .dense-section { padding:0 10px 13px; background:#fff; }

    function formatTime(seconds) { const safe=Math.max(0,Math.floor(seconds||0)),m=Math.floor(safe/60),s=safe%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

      stopPlaybackClock();

    function stopPlaybackClock() {

    function upsertWatchRecord(item,current=state.player.current) {
      if(!item?.id)return;
      const total=durationSeconds(item.duration),progress=total?Math.round(Math.max(0,Math.min(total,current))/total*100):0;
      const record={id:item.id,progress,current:formatTime(current),lastViewed:'刚刚'};
      const index=state.watchRecords.findIndex(entry=>entry.id===item.id);
      if(index>=0)state.watchRecords.splice(index,1);
      state.watchRecords.unshift(record);
    }
    function runPlaybackClock(item) {
      stopPlaybackClock();
      startPlayback.clock=setInterval(()=>{
        if(state.screen!=='detail'||state.player.status!=='playing')return stopPlaybackClock();
        const total=durationSeconds(item.duration),owned=hasAccess(item),limit=owned?total:(item.trial||5);
        state.player.current=Math.min(limit,state.player.current+state.player.speed);
        const seek=document.querySelector('[data-action="player-seek"]');
        if(seek){seek.value=state.player.current;seek.style.setProperty('--progress',`${total?state.player.current/total*100:0}%`);}
        const time=document.querySelector('.player-time');
        if(time)time.textContent=`${formatTime(state.player.current)} / ${item.duration}`;
        const hint=document.querySelector('.player-trial-hint');
        if(hint&&!owned)hint.textContent=`${entitlement(item)} DEMO · 剩余 ${formatTime(Math.max(0,limit-state.player.current))}`;
        if(state.player.current>=limit){stopPlaybackClock();upsertWatchRecord(item,limit);state.player.status=owned?'paused':'trialEnded';render();toast(owned?'播放完成，进度已记录':'5秒试看已结束');}

    function shortSlide(feed,index) {

    function startShortPlayback(stack,feeds) {
      clearInterval(shortPlaybackTimer);
      const feed=feeds[state.shortIndex],item=feed&&catalog[feed.id];
      const ageGate=document.querySelector('#ageGate');
      if(!ageGate?.classList.contains('hidden')||!launchFlow.classList.contains('hidden')||!campaignLayer.classList.contains('hidden'))return;
      if(!item||state.shortPaused||(!hasAccess(item)&&state.shortTrialEnded.has(item.id)))return;
      shortPlaybackTimer=setInterval(()=>{
        if(state.shortPaused)return;
        const activeFeed=feeds[state.shortIndex],activeItem=activeFeed&&catalog[activeFeed.id];
        if(!activeItem)return;
        const owned=hasAccess(activeItem),total=Math.max(1,durationSeconds(activeItem.duration)),limit=owned?total:(activeItem.trial||0);
        const elapsed=Math.min(limit,(state.shortElapsed[activeItem.id]||0)+1);
        state.shortElapsed[activeItem.id]=elapsed;
        state.shortProgress[`${state.shortTab}:${state.shortIndex}`]=Math.min(100,elapsed/total*100);
        const slide=stack.querySelector(`[data-short-index="${state.shortIndex}"]`),bar=slide?.querySelector('.progress-line'),badge=slide?.querySelector('.trial');
        if(bar){bar.value=elapsed;bar.style.setProperty('--progress',`${state.shortProgress[`${state.shortTab}:${state.shortIndex}`]}%`);}
        if(badge&&!owned)badge.textContent=`${entitlement(activeItem)}试看 · 剩余 ${formatTime(Math.max(0,limit-elapsed))}`;
        if(!owned&&elapsed>=limit){
          clearInterval(shortPlaybackTimer);shortPlaybackTimer=null;state.shortPaused=true;state.shortCleanScreen=false;state.shortTrialEnded.add(activeItem.id);renderShort();
        }
      },1000);
    }

    function requestRefund(id) {
      const o=state.orders.find(order=>order.id===id); if(!o||o.status!=='成功'||o.refundEligible===false)return toast('当前订单不可申请退款，可联系客服核查');

    function settleRefund(id,approved) {
      const o=state.orders.find(order=>order.id===id); if(!o||o.status!=='退款中')return toast('退款状态已变化，请刷新');
      if(!approved){o.status='退款拒绝';o.refundReason='演示结果：不满足退款条件，可通过客服提交申诉。';state.activeOrderId=id;state.screen='orderDetailPage';render();return;}
      if(o.type==='member'){
        const grantedCoins=o.plan.coinGift||0,grantedQuota=o.plan.ai||0;
        if(state.coins<grantedCoins||state.aiQuota<grantedQuota){o.status='退款拒绝';o.refundReason='演示结果：赠送资产已使用，已转人工核算处理。';openPage('orderDetailPage',{activeOrderId:id});return;}
        const beforeCoins=state.coins,beforeQuota=state.aiQuota;
        state.coins-=grantedCoins;state.aiQuota-=grantedQuota;
        const entitlement=state.memberships.find(plan=>plan.family===o.plan.family);
        if(grantedCoins)pushLedger('付费金币',-grantedCoins,beforeCoins,'会员赠送金币退款冲正',o.id,'已退款');
        if(grantedQuota)pushLedger('AI额度',-grantedQuota,beforeQuota,'会员退款冲正',o.id,'已退款');
        if(entitlement){const beforeDays=entitlement.remainingDays||0;entitlement.remainingDays=Math.max(0,beforeDays-o.plan.termDays);entitlement.endAt=new Date(Math.max(Date.now(),Date.parse(entitlement.endAt)||Date.now())-o.plan.termDays*86400000).toISOString();entitlement.sourceOrders=(entitlement.sourceOrders||[]).filter(source=>source.id!==o.id);pushLedger('会员有效期',-o.plan.termDays,beforeDays,'会员退款冲正',o.id,'已退款');if(!entitlement.remainingDays)state.memberships=state.memberships.filter(plan=>plan!==entitlement);}
      }
      if(o.type==='coins'){
        if(state.coins<o.coins){o.status='退款拒绝';o.refundReason='演示结果：充值金币已使用，已转人工核算处理。';state.activeOrderId=id;state.screen='orderDetailPage';render();return;}
        const beforeCoins=state.coins;
        state.coins-=o.coins;
        pushLedger('付费金币',-o.coins,beforeCoins,'充值退款冲正',o.id,'已退款');
      }
      if(o.type==='unlock'){
        const beforeCoins=state.coins;
        state.purchased.delete(o.item.id);
        state.coins+=o.allocation.coins||0;
        if(o.allocation.coins)pushLedger('付费金币',o.allocation.coins,beforeCoins,'精品内容退款退回',o.id,'已退款');
      }
      if(o.type==='collection'){
        const beforeCoins=state.coins;
        state.purchased.delete(o.collection.id);collections[o.collection.id].purchased=false;
        state.coins+=o.allocation.coins||0;
        if(o.allocation.coins)pushLedger('付费金币',o.allocation.coins,beforeCoins,'合集退款退回',o.id,'已退款');
      }
      o.status='已退款';o.refundReason='演示结果：服务端校验通过，相关未消费权益已冲正；实际到账时间以支付渠道为准。';state.activeOrderId=id;state.screen='orderDetailPage';render();toast('退款结果已同步');
    }

      if(action==='search-type'){state.searchType=target.dataset.value;renderGlobalSearch();}
      if(action==='search-hot'||action==='search-history')commitGlobalSearch(target.dataset.value);
      if(action==='clear-search-history'){state.searchHistory=[];renderGlobalSearch();toast('搜索历史已清空');}
      if(action==='search-tag')openPage('tagPage',{tagName:target.dataset.value||state.searchQuery||'城市',tagSort:'推荐'});
      if(action==='message')openMessages();
      if(action==='comments')openComments(state.tab==='community'?'community':'video');
      if(action==='orders')openOrders();
      if(action==='order-detail'||action==='open-order-page'){ensureLogin(()=>openPage('orderDetailPage',{activeOrderId:target.dataset.id}),'登录后可查看订单详情');return;}
      if(action==='query-order-page'){const order=state.orders.find(item=>item.id===target.dataset.id);if(!order)return toast('订单不存在');state.pending=order;grantOrder();closeSheet();state.activeOrderId=order.id;state.screen='orderDetailPage';render();}
      if(action==='supplement-order'){const order=state.orders.find(item=>item.id===target.dataset.id);if(!order)return toast('订单不存在');state.supportDraft={type:'补单申请',bizNo:order.id,content:`请核查“${order.title}”的支付结果与权益发放状态。`};ensureLogin(()=>openPage('supportPage'));}
      if(action==='request-refund')requestRefund(target.dataset.id);
      if(action==='settle-refund')settleRefund(target.dataset.id,target.dataset.result==='approve');
      if(action==='watch-records')openWatchRecords();
      if(action==='favorites')ensureLogin(()=>openPage('recordsPage',{recordTab:'收藏'}));
      if(action==='mine-purchases')ensureLogin(()=>openPage('purchasesPage'));
      if(action==='wallet-tab'){state.walletTab=target.dataset.value;renderWallet();}
      if(action==='order-filter'){state.orderFilter=target.dataset.value;renderOrdersPage();}
      if(action==='record-tab'){state.recordTab=target.dataset.value;renderRecordsPage();}
      if(action==='remove-record'){
        const tabName=target.dataset.recordTab,key=target.dataset.key;
        if(tabName==='收藏')state.favorites.delete(key);
        else if(tabName==='观看记录')state.watchRecords=state.watchRecords.filter(record=>record.id!==key);
        else return toast('已购权益不可删除');
        renderRecordsPage();toast(`已从${tabName}移除`);
      }
      if(action==='clear-records'){
        if(state.recordTab==='收藏')state.favorites.clear();
        else if(state.recordTab==='观看记录')state.watchRecords=[];
        else return toast('已购权益不可清空');
        renderRecordsPage();toast(`${state.recordTab}已清空；订单与资产审计不受影响`);
      }
      if(action==='message-filter'){state.messageFilter=target.dataset.value;renderMessagesPage();}
      if(action==='read-all-messages'){state.messages.forEach(message=>message.read=true);renderMessagesPage();toast('已全部标为已读');}
      if(action==='open-message'){const message=state.messages.find(item=>item.id===target.dataset.id);if(!message)return toast('消息已失效');message.read=true;if(message.target==='settings')openPage('settingsPage');else if(message.target==='collection')openPage('collection');else if(message.target==='aiTask')openPage('aiTaskDetail',{activeTaskId:message.targetId});else if(message.target==='order')openPage('orderDetailPage',{activeOrderId:message.targetId});else if(message.target==='post'){const post=communityPosts().find(item=>item.id===message.targetId)||profilePosts.find(item=>item.id===message.targetId);post?openPage('postDetail',{activePost:post}):toast('关联帖子已失效，消息记录仍保留');}else if(message.target==='content'&&catalog[message.targetId]){rememberPage();state.contentId=message.targetId;preparePlayer(catalog[message.targetId]);state.screen='detail';render();}else toast('关联对象已失效，消息记录仍保留');}
      if(action==='support'){state.supportDraft={type:'订单查单',bizNo:target.dataset.bizNo||'',content:target.dataset.bizNo?'请协助查询该业务单号的当前状态。':''};ensureLogin(()=>openPage('supportPage'));}
      if(action==='create-ticket'){const contentValue=document.querySelector('#ticketContent')?.value.trim(),bizNo=document.querySelector('#ticketBizNo')?.value.trim(),type=document.querySelector('#ticketType')?.value||'订单查单';if(!contentValue)return toast('请描述需要处理的问题');if(type==='补单申请'&&!bizNo)return toast('补单申请必须填写业务单号');state.tickets.unshift({id:businessId('TICKET'),type,bizNo,content:contentValue.slice(0,120),status:'处理中',time:'刚刚'});state.supportDraft={type:'订单查单',bizNo:'',content:''};renderSupportPage();toast(type==='补单申请'?'补单核查工单已创建':'客服工单已创建');}
      if(action==='toggle-setting'){const key=target.dataset.key;state.settings[key]=!state.settings[key];renderSettingsPage();}
      if(action==='app-icon')openPage('appIconPage',{selectedAppIcon:state.appIcon});
      if(action==='app-icon-select'){state.selectedAppIcon=target.dataset.value;renderAppIconPage();}
      if(action==='app-icon-apply'){
        const selected=appIconOptions.find(option=>option.id===state.selectedAppIcon)||appIconOptions[0];
        if(selected.id===state.appIcon)return toast('当前已使用该图标');
        openSheet(`${sheetTitle('确认更换桌面图标',`${selected.name}图标 · APP名称仍为基咔`)}<div class="app-icon-hero" style="margin-top:16px;">${appIconArtwork(selected,'large')}<p class="notice">只切换桌面图标资源，不修改APP名称。系统拒绝或设备不支持时继续保留原图标。</p></div><button class="btn-primary" data-action="confirm-app-icon" data-value="${selected.id}">确认更换图标</button>`);
      }
      if(action==='confirm-app-icon'){const selected=appIconOptions.find(option=>option.id===target.dataset.value);if(!selected)return toast('图标配置已更新，请重新选择');state.appIcon=selected.id;state.selectedAppIcon=selected.id;closeSheet();renderAppIconPage();toast(`桌面图标已切换为“${selected.name}”，APP名称仍为基咔`);}
      if(action==='devices')ensureLogin(()=>openPage('devicesPage'));
      if(action==='logout-device'){const device=state.devices.find(item=>item.id===target.dataset.id);if(!device||device.current)return toast('当前设备不能在此退出');openSheet(`${sheetTitle('验证并退出设备',device.name)}<p class="notice">退出后该设备会话立即失效。原型以二次确认代替真实短信/密码验证。</p><button class="btn-primary" data-action="confirm-logout-device" data-id="${device.id}">确认退出该设备</button>`);}
      if(action==='confirm-logout-device'){state.devices=state.devices.filter(device=>device.id!==target.dataset.id);closeSheet();renderDevicesPage();toast('该设备已退出登录');}
      if(action==='policy')openSheet(`${sheetTitle(target.dataset.value,'协议、隐私与未成年人保护入口可正常访问')}<div class="notice" style="margin-top:16px;">当前为原型摘要，正式文本由法务确认后以版本号冻结。</div><button class="btn-primary" data-action="close-sheet">我知道了</button>`);
      if(action==='logout'){openSheet(`${sheetTitle('退出当前账号','退出后将回到游客状态')}<div class="notice" style="margin-top:16px;">会员、金币、订单和内容记录仍保留在账号中，再次登录后恢复。</div><button class="btn-primary" data-action="confirm-logout">确认退出登录</button><button class="btn-secondary" data-action="close-sheet">取消</button>`);return;}
      if(action==='confirm-logout'){state.accountSnapshot={collectionPurchased:collections.set1.purchased};collections.set1.purchased=false;['following','favorites','likedPosts','shortLiked','wantedRequests','purchased'].forEach(key=>{state.accountSnapshot[key]=[...state[key]];state[key].clear();});state.loggedIn=false;loginContinuation=null;closeSheet();stopPlaybackClock();state.navigationStack=[];state.tab='mine';state.screen='main';render();toast('已退出登录');return;}
      if(action==='account-cancel')ensureLogin(()=>openPage('cancelPage'));
      if(action==='confirm-cancel'){const pendingOrders=state.orders.some(o=>['待支付','处理中','退款中'].includes(o.status)),openTickets=state.tickets.some(t=>t.status!=='已完成');if(pendingOrders||state.frozen>0||openTickets)return toast('存在未完成订单、冻结资产或未结工单，暂不能注销');openSheet(`${sheetTitle('再次验证身份','注销申请属于高风险操作')}<p class="notice">正式环境需短信/密码再次验证。确认后进入冷静期，冷静期内可撤销。</p><button class="btn-primary" data-action="execute-cancel">验证通过并提交申请</button>`);}
      if(action==='execute-cancel'){closeSheet();state.cancelStarted=true;state.cancelRequestedAt=new Date().toISOString();state.cancelCoolingEndsAt=new Date(Date.now()+7*86400000).toISOString();renderCancelPage();addMessage('系统','注销申请已提交','7天冷静期内可撤销。','settings');}
      if(action==='withdraw-cancel'){state.cancelStarted=false;renderCancelPage();toast('注销申请已撤销');}
      if(action==='my-posts')ensureLogin(()=>openPage('myPostsPage',{myPostFilter:'全部'}));
      if(action==='my-requests')ensureLogin(()=>openPage('myRequestsPage',{myRequestTab:'requests'}));
      if(action==='my-request-tab'){state.myRequestTab=target.dataset.value==='liked'?'liked':'requests';renderMyRequestsPage();}
      if(action==='my-post-filter'){state.myPostFilter=target.dataset.value;renderMyPostsPage();}
      if(action==='post-status-detail')openSheet(`${sheetTitle(target.dataset.title,`当前状态：${target.dataset.status}`)}<div class="notice" style="margin-top:16px;">${target.dataset.reason}</div><button class="btn-primary" data-action="close-sheet">我知道了</button>`);
      if(action==='edit-my-post'){state.postDraft={topic:target.dataset.topic||'影评',image:false,video:false,title:target.dataset.title||'',body:'请补充修改后的正文内容。',bounty:20};openPage('postEditor');}
      if(action==='post-appeal'){openSheet(`${sheetTitle('帖子下架申诉','提交后由治理人员处理')}<textarea class="input textarea" placeholder="补充授权信息或申诉理由"></textarea><button class="btn-primary" data-action="submit-post-appeal">提交申诉</button>`);}
      if(action==='submit-post-appeal'){closeSheet();addMessage('社区','下架申诉已提交','结果将通过消息中心通知。');toast('申诉已提交');}
      if(action==='privacy')openPrivacy();
    });
    document.addEventListener('input',e=>{if(['loginNickname','loginAccount','loginCode','loginPassword','loginPasswordConfirm'].includes(e.target.id))setLoginFieldError(e.target.id,'');if(e.target.id==='postTitle')state.postDraft.title=e.target.value;if(e.target.id==='postBody')state.postDraft.body=e.target.value;if(e.target.id==='requestBounty')state.postDraft.bounty=Number(e.target.value)||0;if(e.target.id==='searchInput')state.searchQuery=e.target.value;if(e.target.id==='videoCommentInput')state.commentDrafts.video=e.target.value;if(e.target.id==='communityCommentInput')state.commentDrafts.community=e.target.value;if(e.target.id==='profileSearch'){state.profileQuery=e.target.value;const results=document.querySelector('#profileResults');if(results)results.innerHTML=profileResultsMarkup();}});
    document.addEventListener('keydown',e=>{if(e.target.id==='searchInput'&&e.key==='Enter'){e.preventDefault();commitGlobalSearch(e.target.value);}});
    document.addEventListener('input',e=>{
      const shortSeek=e.target.closest('[data-action="short-seek"]');
      if(shortSeek){const item=catalog[shortSeek.dataset.id];if(!item)return;const total=Number(shortSeek.max)||1,limit=hasAccess(item)?total:(item.trial||0),elapsed=Math.min(limit,Number(shortSeek.value));state.shortElapsed[item.id]=elapsed;state.shortProgress[`${state.shortTab}:${state.shortIndex}`]=elapsed/total*100;shortSeek.value=elapsed;shortSeek.style.setProperty('--progress',`${elapsed/total*100}%`);return;}
      const seek=e.target.closest('[data-action="player-seek"]');if(!seek)return;const item=catalog[state.contentId],limit=hasAccess(item)?Number(seek.max):(item.trial||5);state.player.current=Math.min(limit,Number(seek.value));seek.value=state.player.current;seek.style.setProperty('--progress',`${Number(seek.value)/Number(seek.max)*100}%`);const time=seek.parentElement.querySelector('.player-time');if(time)time.textContent=`${formatTime(state.player.current)} / ${item.duration}`;
    });
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet();});
    render();
  </script>
</body>
</html>
